<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="App Launcher Dashboard - Accesso rapido a tutte le applicazioni" />
  <title>App Launcher · Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚀%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">🚀</span>
        <div class="brand-text">
          <h1>App Launcher</h1>
          <p class="subtitle">Dashboard delle applicazioni</p>
        </div>
      </div>

      <div class="header-actions">
        <div class="clock" id="clock" aria-live="polite"></div>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Cambia tema">
          <span class="theme-icon light-icon">☀️</span>
          <span class="theme-icon dark-icon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="toolbar">
      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">🔎</span>
        <input
          type="search"
          id="search"
          class="search-input"
          placeholder="Cerca un'applicazione per nome, tag o categoria…"
          autocomplete="off"
        />
      </div>
      <div class="filters" id="filters" role="tablist" aria-label="Filtri categoria"></div>
    </section>

    <section class="stats" id="stats" aria-label="Statistiche"></section>

    <section id="app-grid" class="app-grid" aria-live="polite"></section>

    <p id="empty-state" class="empty-state" hidden>
      Nessuna applicazione corrisponde alla tua ricerca.
    </p>
  </main>

  <footer class="app-footer">
    <p>
      <span id="year"></span> · Dashboard costruita per l'ecosistema
      <a href="https://github.com/ssurli" target="_blank" rel="noopener">ssurli</a>
    </p>
  </footer>

  <template id="card-template">
    <article class="card">
      <div class="card-head">
        <div class="card-icon" aria-hidden="true"></div>
        <span class="card-status" aria-label="stato"></span>
      </div>
      <h2 class="card-title"></h2>
      <p class="card-description"></p>
      <div class="card-tags"></div>
      <div class="card-actions">
        <a class="btn btn-primary card-open" target="_blank" rel="noopener">Apri</a>
        <a class="btn btn-ghost card-repo" target="_blank" rel="noopener">Repo ↗</a>
      </div>
    </article>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
